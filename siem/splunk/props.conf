# UNTESTED against a live Splunk instance (see siem/splunk/README.md).
# Events are sent by SplunkHecSink to /services/collector/event with
# index=canary, sourcetype=canary:event, source=canary-qday.

[canary:event]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "ts":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 65536
