# UNTESTED against a live Splunk instance (see siem/splunk/README.md).
# Equivalent of the mock SIEM rule (src/canary_qday/siem/mock_hec.py):
# fire on trap_triggered, at most once per token_id per 60 s.
#
# KNOWN GAP: Splunk's native webhook posts its own JSON payload
# (sid, search_name, app, owner, results_link, result{...}), not the Alert
# schema expected by POST /v1/alerts/{path_secret}. An adapter that maps
# `result` to the Alert schema is required and is NOT implemented.

[canary_trap_triggered]
search = index=canary sourcetype="canary:event" event=trap_triggered \
  | dedup token_id \
  | table _time event_id ts token_id stream_id profile params_id key_id epoch src_ip user_agent
cron_schedule = * * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = token_id
alert.suppress.period = 60s
alert.severity = 5
alert.track = 1
action.webhook = 1
# Replace <PATH_SECRET> with the response engine's path secret (>= 32 chars).
# Keep the response engine on an isolated network and enable the Splunk webhook allow-list.
action.webhook.param.url = https://response.lab.internal:8090/v1/alerts/<PATH_SECRET>

# --- Access detection (UNTESTED against a live Splunk instance) -------------------
# Equivalent of the mock SIEM access rules (src/canary_qday/siem/mock_hec.py):
#   unauthorized_key_use    : a refused handshake whose reason is "revoked_key".
#   refused_handshake_burst : >= N refused handshakes from one src_ip within T s.
# Fields used below are exactly those emitted in HandshakeEvent
# (event=handshake, outcome, reason, src_ip, key_id, profile, epoch).
# Same KNOWN GAP as above: Splunk's native webhook payload is not the AccessAlert
# schema expected by POST /v1/alerts/access; an adapter is required and NOT implemented.
# Thresholds here mirror the provisional defaults (N=5, T=30 s) and must be tuned.

[canary_unauthorized_key_use]
search = index=canary sourcetype="canary:event" event=handshake outcome=refused reason=revoked_key \
  | dedup src_ip key_id \
  | table _time event_id ts src_ip key_id profile epoch reason outcome
cron_schedule = * * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src_ip,key_id
alert.suppress.period = 60s
alert.severity = 4
action.webhook = 1
action.webhook.param.url = https://response.lab.internal:8090/v1/alerts/access/<PATH_SECRET>

[canary_refused_handshake_burst]
search = index=canary sourcetype="canary:event" event=handshake outcome=refused \
  | stats count by src_ip \
  | where count >= 5
cron_schedule = * * * * *
dispatch.earliest_time = -30s
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 30s
alert.severity = 3
action.webhook = 1
action.webhook.param.url = https://response.lab.internal:8090/v1/alerts/access/<PATH_SECRET>
